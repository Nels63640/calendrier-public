name: Vérifier la version iPhone
on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-validation
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier Xcode et le moteur des récurrences
        run: |
          xcodebuild -version
          swift test --package-path apps/ios/AlarmCore
      - name: Préparer le projet Xcode
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd apps/ios
          xcodegen generate
      - name: Compiler pour iPhone Simulator
        run: xcodebuild build-for-testing -project apps/ios/FamilyCalendar.xcodeproj -scheme FamilyCalendar -destination "generic/platform=iOS Simulator" -derivedDataPath apps/ios/.derivedData CODE_SIGNING_ALLOWED=NO
      - name: Tester sur un simulateur unique
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if v["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test-without-building -parallel-testing-enabled NO -project apps/ios/FamilyCalendar.xcodeproj -scheme FamilyCalendar -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath apps/ios/.derivedData -resultBundlePath apps/ios/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Conserver les résultats Xcode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore
