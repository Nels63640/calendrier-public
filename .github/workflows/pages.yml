name: Vérifier et publier le calendrier
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run format:check
      - name: Préparer Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Construire le site public
        run: |
          node -e "if (!process.env.VITE_SUPABASE_PUBLISHABLE_KEY) throw new Error('Configurer la variable publique Supabase du dépôt')"
          npm run build
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
